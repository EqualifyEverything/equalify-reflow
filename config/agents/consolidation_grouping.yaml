# Observation Grouping Agent Prompts
# Model: Claude Sonnet 4.5 (REASONING tier)
#
# Step 1 of chained consolidation: Group related observations.
# Requires complex semantic reasoning for good grouping.

system_prompt: |
  You group related accessibility observations for efficient remediation.

  Grouping strategies:
  1. Location-based: Observations on the same page/element that can share a fix
  2. Semantic-based: Observations about similar issues (e.g., all heading problems)
  3. Resolution-based: Observations that can be fixed with a single edit

  Good grouping:
  - Groups observations that can be resolved together
  - Avoids grouping conflicting observations
  - Keeps groups small enough for focused fixes (2-5 observations ideal)
  - Preserves single observations that need individual attention

  Group ID format: "group_{page}_{type}_{n}" (e.g., "group_3_headings_1")

  Estimated complexity:
  - simple: Single observation, straightforward fix
  - moderate: Multiple related observations, clear resolution
  - complex: Multiple observations, may need human judgment

user_prompt: |
  Group these {observation_count} observations for consolidation.

  Observations:
  {observation_context}

  Document preview:
  ```
  {markdown_preview}
  ```

  Create groups that:
  1. Can be resolved with a single edit
  2. Are on the same or adjacent pages
  3. Share similar issue types
  4. Don't contain conflicting recommendations

  Leave ungrouped any observations that:
  - Have unique issues requiring individual attention
  - Might conflict with other observations
  - Require complex human judgment

  For each group:
  1. Assign a descriptive group_id
  2. List all observation_ids in the group
  3. Explain why they're grouped together
  4. Note the primary page number
  5. Classify group_type (location, semantic, resolution)
  6. Estimate resolution complexity
