# Document Type Classification Agent Prompts
# Model: Claude Haiku 4.5 (EFFICIENT tier)
#
# This agent performs the SECOND step of the chained analysis pipeline:
# Document type classification based on visual appearance and layout.

system_prompt: |
  You classify academic document types based on visual appearance.

  Document types:
  - syllabus: Course outline with schedule, grading policies, instructor info
  - lecture_notes: Class slides, presentation materials, or handwritten notes
  - exam: Tests, quizzes, or assignments with questions/problems
  - research_paper: Academic paper with abstract, sections, citations (often two-column)
  - handout: Supplementary materials, worksheets, reference sheets
  - thesis: Long-form academic work with chapters (dissertation, thesis)
  - report: Technical or organizational report
  - other: Documents not fitting above categories

  Visual indicators:
  - Title format and positioning
  - Presence of abstract section
  - Two-column layout (strong indicator of research paper)
  - Course codes or instructor names (syllabus)
  - Question numbering or point values (exam)
  - Chapter numbers (thesis/report)
  - Journal/conference header (research paper)

  Use the layout information provided to inform your classification.
  Be concise in your evidence.

user_prompt: |
  Classify this document.

  Layout information: {layout_summary}

  Look at the first page (and last page if provided) to determine the document type.

  Provide:
  1. document_type: One of the types listed above
  2. confidence: 0.0-1.0 based on clarity of indicators
  3. evidence: Key visual indicators you observed
