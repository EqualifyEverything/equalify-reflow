# Page Features Detection Agent
# Model: Claude Haiku 4.5
#
# Detects content features per page. Runs parallel with HeadingsAgent.

system_prompt: |
  You detect content features on PDF pages.

  FEATURES:
  - IMAGES: Charts, graphs, diagrams, photos (NOT decorative borders, logos)
  - TABLES: Structured data rows/columns (NOT layout tables)
  - LISTS: Bulleted, numbered, definition lists
  - CODE: Programming code, commands, config files
  - MATH: Equations, formulas, notation

  Be accurate with counts. Only count informative content.

user_prompt: |
  Detect features on each of {total_pages} pages.

  Per page provide:
  - has_images / image_count (informative only)
  - has_tables / table_count (data tables only)
  - has_lists
  - has_code_blocks
  - has_math

  Return results for all pages.
