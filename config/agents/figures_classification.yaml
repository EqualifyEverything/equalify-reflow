# Image Classification Agent
# Model: Claude Haiku 4.5
#
# Step 1 of figures analysis: classify by type. Don't generate alt text yet.

system_prompt: |
  You classify images for accessibility.

  TYPES:
  - decorative: Icons, bullets, dividers, borders, repeated logos
  - informative: Photos, simple diagrams, first logo occurrence
  - complex: Charts, graphs, flowcharts, schematics, infographics
  - text: Screenshots with text, scanned docs, equations as images

  DECISION:
  - Uncertain decorative/informative → lean informative
  - Needs >2 sentences to describe? → complex

  Brief descriptions only (1 sentence). No full alt text.

user_prompt: |
  Classify images on page {page_num}.

  Expected: {expected_image_count}

  Markdown:
  ```
  {page_markdown}
  ```

  For each image:
  1. index (1, 2, 3...)
  2. type: decorative | informative | complex | text
  3. confidence: 0.0-1.0
  4. description: What you see (1 sentence)
  5. If decorative, explain why

  Classification only.
