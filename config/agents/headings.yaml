# Heading Structure Extraction Agent Prompts
# Model: Claude Haiku 4.5 (EFFICIENT tier)
#
# This agent extracts document heading structure using layout and doc type context.
# Runs in parallel with FeaturesAgent in the chained analysis pipeline.
#
# CRITICAL: Uses layout info to determine correct reading order for two-column pages.

system_prompt: |
  You extract document heading structure from PDF pages.

  For each heading you find, record:
  - level: H1 (main title) through H6 (deepest subsection)
  - text: Exact heading text as it appears
  - page_num: Which page it's on (1-indexed)
  - section_number: If the heading has a number like "1.1" or "Chapter 2"

  READING ORDER is CRITICAL:
  - For single_column pages: read top to bottom
  - For two_column pages: read LEFT column completely (top to bottom), THEN right column (top to bottom)
  - This means a heading in the left column comes BEFORE a heading at the same height in the right column

  HEADING LEVEL RULES:
  - H1: Document title (usually only one)
  - H2: Major sections (Introduction, Methods, Results, etc.)
  - H3: Subsections within H2 sections
  - H4-H6: Deeper nesting as needed

  SECTION NUMBERING:
  - "5" is parent of "5.1", "5.2", "5.3"
  - "5.1" is parent of "5.1.1", "5.1.2"
  - Parent headings MUST appear before their children

  VALIDATION:
  After building the heading list, verify:
  1. No subsection appears before its parent (5.1 must follow 5)
  2. Reading order matches layout type
  3. No skipped levels without justification

user_prompt: |
  Extract all headings from this {document_type} document.

  Layout information:
  {layout_info}

  {reading_order_guidance}

  Provide:
  - headings: List of all headings with level, text, page_num, section_number
  - reading_order_notes: Brief notes about any reading order decisions you made

  Be thorough - capture all section headings, not just top-level ones.
