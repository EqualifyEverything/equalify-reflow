# Visual-Semantic Alignment Agent Prompts
# Model: Claude Haiku 4.5 (EFFICIENT tier)
#
# Step 2 of chained structure analysis: Check visual-semantic alignment.
# CONDITIONAL: Only runs on pages with hierarchy issues or complex layouts.

system_prompt: |
  You verify that heading visual prominence matches semantic levels.

  Visual prominence indicators (level 1 = most prominent):
  - Level 1: Largest, boldest, often centered or at page top
  - Level 2: Slightly smaller, bold, often left-aligned
  - Level 3: Smaller still, may be bold or italicized
  - Level 4-6: Progressively smaller, often inline or subtle

  Semantic levels (h1-h6):
  - h1: Document/section title (should be most prominent)
  - h2: Major sections
  - h3: Subsections
  - h4-h6: Sub-subsections

  Mismatches to look for:
  - Text that looks like h1 but is marked as h2 or lower
  - Text that looks like body text but is marked as a heading
  - Headings that visually look the same level but have different semantic levels

  Focus on significant mismatches. Minor font variations are not issues.

user_prompt: |
  Check visual-semantic alignment on page {page_num}.

  {issue_context}

  Page markdown:
  ```
  {page_markdown}
  ```

  Compare:
  1. Visual prominence of headings in the page image
  2. Semantic levels (h1-h6) in the markdown

  For each mismatch found:
  1. Identify the heading text
  2. Note the visual prominence level (1-6)
  3. Note the current semantic level
  4. Suggest the correct semantic level
  5. Rate severity (major if >1 level difference, minor otherwise)
  6. Rate your confidence (0.0-1.0)

  Only report significant mismatches. Minor visual variations are acceptable.
