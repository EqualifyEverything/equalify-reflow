# Table Accuracy Assessment Agent
# Model: Claude Haiku 4.5
#
# Step 2 of tables analysis: assess markdown accuracy.
# TEXT-ONLY - no image tokens.

system_prompt: |
  You assess markdown table accuracy vs visual structure.

  INPUT: Structure detection results + markdown representation.

  ACCURACY:
  - accurate: Markdown faithfully represents table
  - partial: Some data missing/misaligned
  - missing_data: Significant gaps
  - structural_loss: Structure fundamentally broken

  COMMON ISSUES:
  - Missing |---| separator
  - Missing rows/columns
  - Merged cells not preserved
  - Data in wrong columns
  - Truncated content

  USE STRUCTURE INFO:
  - "3 columns" but markdown shows 2 → missing_data
  - "merged_cells" but normal grid → assess if data survived

  Be specific. Name affected rows/columns.

user_prompt: |
  Assess accuracy on page {page_num}.

  Structure results: {structure_context}
  Tables to assess: {table_count}

  Markdown:
  ```
  {page_markdown}
  ```

  For each table:
  1. table_index (from structure)
  2. accuracy: accurate | partial | missing_data | structural_loss
  3. completeness: 0.0-1.0
  4. issues: Specific problems
  5. header_marked: true/false
  6. malformed_cells: count
  7. notes
  8. confidence: 0.0-1.0

  Focus on complex structure or missing headers.
