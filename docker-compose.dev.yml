# Equalify PDF Converter - Development Override Configuration
# This file adds LocalStack and development-specific configurations
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # LocalStack - Local AWS cloud stack for development
  localstack:
    image: localstack/localstack:latest
    container_name: equalify-pdf-localstack
    restart: unless-stopped
    ports:
      - "4566:4566" # LocalStack edge port
      - "4510-4559:4510-4559" # External service port range
    environment:
      - SERVICES=s3,cloudwatch
      - DEBUG=${DEBUG:-0}
      - DATA_DIR=/tmp/localstack/data
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - SKIP_SSL_CERT_DOWNLOAD=1
      - TMPDIR=/tmp/localstack
    volumes:
      - ./infrastructure/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
      - localstack-data:/tmp/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4566/_localstack/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - equalify-network

  # Docling-serve - PDF document conversion sidecar (CPU mode for dev)
  docling-serve:
    image: quay.io/docling-project/docling-serve-cpu:latest
    container_name: equalify-pdf-docling-serve
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - DOCLING_SERVE_LOAD_MODELS_AT_BOOT=true
      - DOCLING_SERVE_ENG_LOC_SHARE_MODELS=true
      - DOCLING_SERVE_MAX_SYNC_WAIT=600
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5001/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 8G
    networks:
      - equalify-network

  # Development overrides for API Gateway
  api-gateway:
    build:
      target: development # Use development stage for hot-reload
    ports:
      - "8080:8080" # API endpoints (includes /metrics)
    volumes:
      # Mount source code for hot-reload (read-only to prevent accidental writes)
      - ./src:/app/src:ro
      # Mount agent prompt configurations
      - ./config:/app/config:ro
      # Mount tests for containerized test runs
      - ./tests:/app/tests:ro
      # Mount pytest configuration
      - ./pytest.ini:/app/pytest.ini:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./tailwind.config.js:/app/tailwind.config.js:ro
      # Mount Docker socket for testcontainers
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount LTI RSA keys for Canvas integration
      - ./keys:/app/keys:ro
      # Mount built pipeline viewer (run `make build-viewer` to update)
      - ./clients/viewer/dist:/app/static/viewer:ro
    environment:
      # AWS Hybrid Configuration - LocalStack for S3/CloudWatch, Real AWS for Bedrock
      # Use service-specific endpoints (no global endpoint to avoid bedrock conflicts)
      - AWS_ENDPOINT_URL_S3=http://localstack:4566
      - AWS_ENDPOINT_URL_CLOUDWATCH=http://localstack:4566
      # AWS_ENDPOINT_URL_BEDROCK_RUNTIME not set → uses real AWS
      # Real AWS credentials from host environment (for Bedrock API access)
      # These override the LocalStack test credentials for services that need real AWS
      # Fallback to 'test' for LocalStack when real credentials aren't available
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      # Clear AWS_PROFILE to prevent boto3 from looking for profile config in container
      - AWS_PROFILE=
      - AWS_DEFAULT_REGION=us-east-1
      # Disable AWS Instance Metadata Service (IMDS) to prevent boto3 hang in Docker
      - AWS_EC2_METADATA_DISABLED=true
      # S3 Configuration
      - S3_TEMP_BUCKET=equalify-pdf-temp
      - S3_RESULTS_BUCKET=equalify-pdf-results
      - S3_PUBLIC_URL=http://localhost:4566
      # Redis: use explicit container name to avoid DNS collision with Canvas Redis
      # when api-gateway is on both equalify-network and canvas-lms_default network
      - REDIS_URL=redis://equalify-pdf-redis:6379
      # Application
      - LOG_LEVEL=DEBUG
      - ENVIRONMENT=dev
      - ENABLE_METRICS=true
      # OpenTelemetry Configuration
      - TELEMETRY_ENABLED=true
      - TELEMETRY_OTLP_ENDPOINT=jaeger:4317
      - TELEMETRY_LOG_PROMPTS=true
      # Logfire Configuration (PydanticAI agent tracing)
      - LOGFIRE_ENABLED=${LOGFIRE_ENABLED:-false}
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN:-}
      # Docling-serve sidecar
      - DOCLING_SERVE_URL=http://docling-serve:5001
    command: [ "uv", "run", "uvicorn", "src.main:app", "--reload", "--host", "0.0.0.0", "--port", "8080", "--proxy-headers", "--forwarded-allow-ips", "*" ]
    networks:
      equalify-network:
        # Default network — redis, localstack hostnames resolve here
    depends_on:
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      docling-serve:
        condition: service_healthy

  # NOTE: Viewer is bundled into the API container
  # In development, run `make build-viewer` to rebuild the frontend
  # Then access it at http://localhost:8080/viewer

  # Redis Exporter - Exposes Redis metrics to Prometheus
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: equalify-pdf-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - equalify-network

  # Prometheus - Metrics collection and storage
  prometheus:
    image: prom/prometheus:latest
    container_name: equalify-pdf-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    depends_on:
      api-gateway:
        condition: service_started
      redis-exporter:
        condition: service_started
    networks:
      - equalify-network
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # Grafana - Metrics visualization and dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: equalify-pdf-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_LOG_LEVEL=info
    volumes:
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - equalify-network
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # Jaeger - Distributed tracing UI for OpenTelemetry
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: equalify-pdf-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - equalify-network
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:16686/" ]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  equalify-network:
    external: false

volumes:
  localstack-data:
    name: equalify-pdf-localstack-data
  prometheus-data:
    name: equalify-pdf-prometheus-data
  grafana-data:
    name: equalify-pdf-grafana-data
