# Equalify PDF Converter - Production Override Configuration
# This file configures production-specific settings for AWS ECS deployment
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up
#
# NOTE: Workers run as background tasks within api-gateway (monolith architecture).
# Worker-specific resource limits are provided as guidance for future ECS task definitions.

services:
  # Production overrides for Redis
  redis:
    # Production Redis should use persistent storage and backup strategies
    # Consider using AWS ElastiCache in production ECS deployment
    environment:
      - REDIS_MAXMEMORY=2gb
      - REDIS_MAXMEMORY_POLICY=allkeys-lru
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # Docling-serve - PDF document conversion sidecar (CPU mode for production)
  docling-serve:
    image: quay.io/docling-project/docling-serve-cpu:latest
    container_name: equalify-pdf-docling-serve-prod
    restart: unless-stopped
    environment:
      - DOCLING_SERVE_LOAD_MODELS_AT_BOOT=true
      - DOCLING_SERVE_ENG_LOC_SHARE_MODELS=true
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5001/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 5G
        reservations:
          cpus: '0.5'
          memory: 4G
    networks:
      - equalify-network

  # Production overrides for API Gateway
  # NOTE: This container runs ALL workers as background tasks (monolith)
  # Resource limits account for API + PII worker + Processing worker + Timeout worker
  api-gateway:
    environment:
      # No AWS_ENDPOINT_URL_* variables = uses real AWS services
      # Credentials from ECS task IAM role (not env vars)
      # Bedrock, S3, and CloudWatch all use real AWS
      - S3_TEMP_BUCKET=equalify-pdf-temp
      - S3_RESULTS_BUCKET=equalify-pdf-results
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
      # Docling-serve sidecar
      - DOCLING_SERVE_URL=http://docling-serve:5001
    depends_on:
      docling-serve:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '4'          # Sufficient for API + all background workers
          memory: 4G         # Sufficient for parallel processing
        reservations:
          cpus: '2'
          memory: 2G

networks:
  equalify-network:
    external: false