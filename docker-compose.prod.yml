# Equalify PDF Converter - Production Override Configuration
# This file configures production-specific settings for AWS ECS deployment
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up

services:
  # Production overrides for Redis
  redis:
    # Production Redis should use persistent storage and backup strategies
    # Consider using AWS ElastiCache in production ECS deployment
    environment:
      - REDIS_MAXMEMORY=2gb
      - REDIS_MAXMEMORY_POLICY=allkeys-lru
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # Production overrides for API Gateway
  api-gateway:
    environment:
      # AWS_ENDPOINT_URL not set - uses real AWS services
      - S3_TEMP_BUCKET=equalify-pdf-temp
      - S3_RESULTS_BUCKET=equalify-pdf-results
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Production overrides for PII Worker
  pii-worker:
    environment:
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Production overrides for Approval Service
  approval-service:
    environment:
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Production overrides for Processing Worker
  processing-worker:
    environment:
      # AWS_ENDPOINT_URL not set - uses real AWS services
      - S3_TEMP_BUCKET=equalify-pdf-temp
      - S3_RESULTS_BUCKET=equalify-pdf-results
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
    deploy:
      replicas: 2  # Multiple workers for parallel processing
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

  # Production overrides for Timeout Worker
  timeout-worker:
    environment:
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

networks:
  equalify-network:
    external: false