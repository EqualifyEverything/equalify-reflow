# Equalify PDF Converter - Base Docker Compose Configuration
# This file defines core services used in all environments (dev/prod)
# Use override files for environment-specific configurations:
#   Development: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#   Production:  docker-compose -f docker-compose.yml -f docker-compose.prod.yml up

services:
  # Redis - Message broker and caching layer
  redis:
    image: redis:7-alpine
    container_name: equalify-pdf-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - equalify-network

  # API Gateway - Main entry point for PDF processing requests
  # Placeholder service for Phase 2 implementation
  api-gateway:
    image: alpine:latest
    container_name: equalify-pdf-api-gateway
    command: sh -c "echo 'API Gateway placeholder - Phase 2' && sleep infinity"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL}
      - S3_TEMP_BUCKET=${S3_TEMP_BUCKET}
      - S3_RESULTS_BUCKET=${S3_RESULTS_BUCKET}
    networks:
      - equalify-network

  # PII Worker - Microsoft Presidio worker for PII detection
  # Placeholder service for Phase 2 implementation
  pii-worker:
    image: alpine:latest
    container_name: equalify-pdf-pii-worker
    command: sh -c "echo 'PII Worker placeholder - Phase 2' && sleep infinity"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_QUEUE_PII=${REDIS_QUEUE_PII:-eq-pdf:queue:pii}
      - REDIS_QUEUE_APPROVAL=${REDIS_QUEUE_APPROVAL:-eq-pdf:queue:approval}
    networks:
      - equalify-network

  # Approval Service - Handles faculty review workflow
  # Placeholder service for Phase 2 implementation
  approval-service:
    image: alpine:latest
    container_name: equalify-pdf-approval-service
    command: sh -c "echo 'Approval Service placeholder - Phase 2' && sleep infinity"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_QUEUE_APPROVAL=${REDIS_QUEUE_APPROVAL:-eq-pdf:queue:approval}
      - REDIS_QUEUE_PROCESSING=${REDIS_QUEUE_PROCESSING:-eq-pdf:queue:processing}
      - REDIS_TIMEOUT_SET=${REDIS_TIMEOUT_SET:-eq-pdf:timeouts:approval}
    networks:
      - equalify-network

  # Processing Worker - PydanticAI multi-agent PDF processing
  # Placeholder service for Phase 2 implementation
  processing-worker:
    image: alpine:latest
    container_name: equalify-pdf-processing-worker
    command: sh -c "echo 'Processing Worker placeholder - Phase 2' && sleep infinity"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_QUEUE_PROCESSING=${REDIS_QUEUE_PROCESSING:-eq-pdf:queue:processing}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL}
      - S3_TEMP_BUCKET=${S3_TEMP_BUCKET}
      - S3_RESULTS_BUCKET=${S3_RESULTS_BUCKET}
    networks:
      - equalify-network

  # Timeout Worker - Monitors and handles approval timeouts
  # Placeholder service for Phase 2 implementation
  timeout-worker:
    image: alpine:latest
    container_name: equalify-pdf-timeout-worker
    command: sh -c "echo 'Timeout Worker placeholder - Phase 2' && sleep infinity"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_TIMEOUT_SET=${REDIS_TIMEOUT_SET:-eq-pdf:timeouts:approval}
      - REDIS_QUEUE_PROCESSING=${REDIS_QUEUE_PROCESSING:-eq-pdf:queue:processing}
    networks:
      - equalify-network

networks:
  equalify-network:
    name: equalify-pdf-network
    driver: bridge

volumes:
  redis-data:
    name: equalify-pdf-redis-data