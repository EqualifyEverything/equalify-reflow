# Prometheus Configuration for Equalify Reflow
# Scrapes metrics from FastAPI application and Redis exporter

global:
  scrape_interval: 15s        # Scrape targets every 15 seconds
  evaluation_interval: 15s     # Evaluate rules every 15 seconds
  external_labels:
    environment: 'dev'
    service: 'equalify-reflow'

# Scrape configurations
scrape_configs:
  # FastAPI application metrics (OpenTelemetry + Prometheus)
  - job_name: 'equalify-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api-gateway:8080']
        labels:
          service: 'api-gateway'
          component: 'fastapi'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Redis metrics via redis_exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          component: 'cache'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          component: 'monitoring'
