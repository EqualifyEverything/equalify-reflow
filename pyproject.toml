[project]
name = "equalify-reflow"
version = "0.1.0b3"
description = "Equalify Reflow — frees content trapped inside PDFs by converting them to accessible, semantic markdown"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.0.0",
    "redis>=5.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "boto3>=1.35.0",
    "pydantic-settings>=2.6.0",
    "presidio-analyzer>=2.2.0",
    "spacy>=3.7.0,<3.8.0",
    "pypdfium2>=4.0.0",
    "pydantic-ai[anthropic,bedrock]>=1.0.12",
    "pyyaml>=6.0.0",
    "pdf2image>=1.17.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl",
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-exporter-prometheus>=0.41b0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "mdformat>=1.0.0",
    "pyspellchecker>=0.8.4",
    "mdformat-gfm>=1.0.0",
    "pymarkdownlnt>=0.9.0",
    "textual>=6.11.0",
    "httpx-sse>=0.4.0",
    "httpx>=0.27.0",
    "mistune>=3.0.0",
    "pylti1p3>=2.0.0",
    "jwcrypto>=1.5.0",
    "jinja2>=3.1.0",
    "logfire>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.5.0",
    "httpx>=0.27.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.15.1",
    "reportlab>=4.4.4",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers --maxfail=10 --cov=src --cov-report=term-missing --cov-report=html --cov-report=xml"
pythonpath = ["src"]
# Timeout settings (5s default, can override per test)
timeout = 5
timeout_func_only = true
markers = [
    "unit: Unit tests (fast <100ms, isolated, fully mocked dependencies)",
    "integration: Integration tests (medium <5s, real Redis/S3, mocked AI)",
    "slow: Slow E2E tests (>5s, full workflows with minimal mocking)",
    "requires_redis: Needs Redis service",
    "requires_s3: Needs S3/LocalStack service",
    "requires_ai: Needs Anthropic API (usually mocked)",
    "verapdf: Requires VeraPDF Docker container for PDF/UA validation",
    "performance: Load and stress tests (weekly runs)",
    "resilience: Failure recovery and error handling scenarios",
    "edge_case: Boundary conditions and unusual inputs",
    "timeout: Override default timeout for specific tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:spacy.*",
    "ignore::DeprecationWarning:weasel.*",
    "ignore::RuntimeWarning:_pytest.stash",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    ".venv/*",
]
branch = true
parallel = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true
packages = ["src"]
explicit_package_bases = true
exclude = [
    ".venv/",
]
# Disable type-arg check - Redis is not generic at runtime in Python 3.11
# but types-redis declares it as generic. This causes runtime errors with FastAPI.
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = ["redis.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pylti1p3.*", "jwcrypto.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.lti.*"]
# LTI module integrates with pylti1p3 which has no type stubs
# and requires some method signature adaptations for async patterns
disable_error_code = ["override", "no-any-return", "abstract", "arg-type", "attr-defined"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aioboto3>=15.1.0",
    "boto3-stubs>=1.42.6",
    "mypy>=1.5.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "reportlab>=4.4.4",
    "ruff>=0.8.0",
    "testcontainers[localstack,redis]>=4.8.0",
    "types-pyyaml>=6.0.12.20250915",
    "types-redis>=4.6.0.20241004",
]
