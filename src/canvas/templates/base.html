<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title | default("Equalify Dashboard") }}</title>
    <link rel="stylesheet" href="/static/canvas/dashboard.css">
    <script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0s9Gn0QLBR+8bTjml5v7GXOFCpnKMQ/1D0C2+V" crossorigin="anonymous"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    {% if error_message %}
    <div class="flex items-center justify-center min-h-screen">
        <div class="bg-white rounded-lg shadow-md p-8 max-w-md text-center">
            <svg class="mx-auto h-12 w-12 text-red-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z" />
            </svg>
            <h1 class="text-xl font-semibold text-gray-900 mb-2">Session Error</h1>
            <p class="text-gray-600">{{ error_message }}</p>
        </div>
    </div>
    {% else %}
    <header class="bg-white border-b border-gray-200">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <h1 class="text-lg font-semibold text-gray-900">Equalify Reflow</h1>
            {% block header_actions %}{% endblock %}
        </div>
    </header>
    <main class="max-w-6xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>
    {% endif %}
</body>
</html>
